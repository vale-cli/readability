# One firing case and one clean case per score, plus the polysyllables. The
# cases live here rather than in the rules so that a Vale older than the
# `tests:` key never reads them as fields it does not know.

- name: AutomatedReadability fires
  rule: ../Readability/AutomatedReadability.yml
  input: |
    Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies, organizational infrastructures, and jurisdictional responsibilities.
  want: |
    1:1:Readability.AutomatedReadability:Try to keep the Automated Readability Index (42.73) below 8.
- name: AutomatedReadability clean
  rule: ../Readability/AutomatedReadability.yml
  input: |
    We changed how the teams work. Each team now owns one part of the product. It is a small change.
  want: ""

