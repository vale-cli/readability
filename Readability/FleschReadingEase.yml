# The Flesch reading-ease score, per paragraph, so the grade lands on the paragraph that earned it
# rather than on line one of the file.
extends: metric
message: "Try to keep the Flesch reading ease score (%s) above 70."
link: https://en.wikipedia.org/wiki/Flesch%E2%80%93Kincaid_readability_tests
level: warning
scope: paragraph
formula: round(flesch_reading_ease, 2)
condition: "< 70"

tests:
  - name: fires
    input: |
      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies, organizational infrastructures, and jurisdictional responsibilities.
    want: |
      1:1:Readability.FleschReadingEase:Try to keep the Flesch reading ease score (-168.78) above 70.
  - name: clean
    input: |
      We changed how the teams work. Each team now owns one part of the product. It is a small change.
    want: ""
