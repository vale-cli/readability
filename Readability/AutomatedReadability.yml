# The Automated Readability Index, per paragraph, so the grade lands on the paragraph that earned it
# rather than on line one of the file.
extends: metric
message: "Try to keep the Automated Readability Index (%s) below 8."
link: https://en.wikipedia.org/wiki/Automated_readability_index
level: warning
scope: paragraph
formula: round(automated_readability, 2)
condition: "> 8"

tests:
  - name: fires
    input: |
      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies, organizational infrastructures, and jurisdictional responsibilities.
    want: |
      1:1:Readability.AutomatedReadability:Try to keep the Automated Readability Index (42.74) below 8.
  - name: clean
    input: |
      We changed how the teams work. Each team now owns one part of the product. It is a small change.
    want: ""
