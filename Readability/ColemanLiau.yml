# The Coleman–Liau index, per paragraph, so the grade lands on the paragraph that earned it
# rather than on line one of the file.
extends: metric
message: "Try to keep the Coleman–Liau Index grade (%s) below 9."
link: https://en.wikipedia.org/wiki/Coleman%E2%80%93Liau_index
level: warning
scope: paragraph
formula: round(coleman_liau, 2)
condition: "> 9"

tests:
  - name: fires
    input: |
      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies, organizational infrastructures, and jurisdictional responsibilities.
    want: |
      1:1:Readability.ColemanLiau:Try to keep the Coleman–Liau Index grade (50.34) below 9.
  - name: clean
    input: |
      We changed how the teams work. Each team now owns one part of the product. It is a small change.
    want: ""
