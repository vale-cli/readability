# The Gunning fog index, per paragraph, so the grade lands on the paragraph that earned it
# rather than on line one of the file.
extends: metric
message: "Try to keep the Gunning-Fog index (%s) below 10."
link: https://en.wikipedia.org/wiki/Gunning_fog_index
level: warning
scope: paragraph
formula: round(gunning_fog, 2)
condition: "> 10"

tests:
  - name: fires
    input: |
      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies, organizational infrastructures, and jurisdictional responsibilities.
    want: |
      1:1:Readability.GunningFog:Try to keep the Gunning-Fog index (40.00) below 10.
  - name: clean
    input: |
      We changed how the teams work. Each team now owns one part of the product. It is a small change.
    want: ""
